name: Custom - Kotlin Backend Checks

on:
  pull_request:
    paths:
      - '_kotlin/backend/**'
      - '.github/workflows/custom-kotlin-backend-checks.yml'
  push:
    branches:
      - main-v4.6.5
    paths:
      - '_kotlin/backend/**'
      - '.github/workflows/custom-kotlin-backend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-kotlin-backend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Custom - Kotlin Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _kotlin/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # ratchet:actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run unit and slice tests
        run: ./gradlew test --no-daemon

      - name: Run OpenSearch integration tests
        run: ./gradlew opensearchIntegrationTest --no-daemon
